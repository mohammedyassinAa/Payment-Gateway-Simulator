# Payment Gateway Simulator Configuration

# Server configuration
server.port=8080

# Application name
spring.application.name=payment-gateway-simulator

# API Security - Admin key for scenario management (change in production)
api.admin.key=${API_ADMIN_KEY:admin-secret-key}

# Logging configuration
logging.level.com.pfa.paymentgateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator configuration - only expose safe endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
